<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Job board · Campus Portal</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body data-page="jobs">
  <header id="site-header"></header>
  <main>
<div class="page container">

<h1>Job board</h1><p class="page__subtitle">Openings shared by alumni. Expired deadlines are hidden by default.</p>
<form class="filters" id="jobs-filters" role="search">
  <div><label for="q">Search</label><input class="input" type="search" id="q" name="q" placeholder="Title, company, location or description"></div>
  <div><label for="jobType">Type</label><select class="select" id="jobType" name="jobType"><option value="">All types</option><option value="full_time">Full time</option><option value="part_time">Part time</option><option value="internship">Internship</option><option value="contract">Contract</option></select></div>
  <div class="btn-row"><button class="btn btn--primary" type="submit">Search</button></div>
</form>
<section class="card" id="post-job" hidden style="margin-bottom:1.2rem"><h2>Post an opening</h2><div id="job-msg" class="alert" role="alert"></div>
<form id="job-form" class="form-grid" novalidate>
  <div><label for="jt">Title</label><input class="input" id="jt" name="title" required></div><div><label for="jc">Company</label><input class="input" id="jc" name="company" required></div>
  <div><label for="jl">Location</label><input class="input" id="jl" name="location" required></div>
  <div><label for="jy">Type</label><select class="select" id="jy" name="jobType"><option value="full_time">Full time</option><option value="part_time">Part time</option><option value="internship">Internship</option><option value="contract">Contract</option></select></div>
  <div><label for="jd">Deadline</label><input class="input" type="date" id="jd" name="deadline"></div>
  <div style="grid-column:1/-1"><label for="jx">Description</label><textarea id="jx" name="description" required></textarea></div>
  <div><button class="btn btn--primary" type="submit">Post job</button></div>
</form></section>
<div id="jobs-list"></div>
</div>
  </main>
  <footer id="site-footer" class="site-footer" data-note="Job board" data-link="/alumni-directory.html" data-link-text="Alumni directory"></footer>
    <script src="/socket.io/socket.io.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
