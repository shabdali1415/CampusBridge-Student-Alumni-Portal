<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Choose a new password · Campus Portal</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body data-page="reset">
  <header id="site-header"></header>
  <main>

<div class="auth"><div class="auth__card"><h1 class="auth__title">Choose a new password</h1>
  <div id="form-msg" role="alert" class="alert"></div>
  <form id="reset-form" novalidate><label for="password">New password</label><input class="input" type="password" id="password" autocomplete="new-password" required>
  <div class="meter" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
      <ul class="rules"><li>At least 8 characters</li><li>One uppercase letter</li><li>A lowercase letter or symbol</li><li>At least one number</li></ul><button class="btn btn--primary btn--block btn--lg" type="submit" style="margin-top:1rem">Update password</button></form></div></div>
  </main>
  <footer id="site-footer" class="site-footer" ></footer>
    <script src="/socket.io/socket.io.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
