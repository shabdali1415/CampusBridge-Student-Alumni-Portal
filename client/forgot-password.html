<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Forgot password · Campus Portal</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body data-page="forgot">
  <header id="site-header"></header>
  <main>

<div class="auth"><div class="auth__card"><h1 class="auth__title">Reset your password</h1>
  <p class="auth__subtitle">Enter your email and we will send a reset link that works for one hour.</p>
  <div id="form-msg" role="alert" class="alert"></div>
  <form id="forgot-form" novalidate><label for="email">Email address</label><input class="input" type="email" id="email" required>
  <button class="btn btn--primary btn--block btn--lg" type="submit" style="margin-top:1rem">Send reset link</button></form>
  <p class="auth__foot" style="margin-top:1rem"><a href="/login.html">Back to sign in</a></p></div></div>
  </main>
  <footer id="site-footer" class="site-footer" ></footer>
    <script src="/socket.io/socket.io.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
